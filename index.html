<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>Meridian Banking</title>
    <script>
      (function(){
        var root = document.documentElement;
        var theme = null;
        var segment = null;
        try {
          theme = localStorage.getItem('meridian-theme');
          segment = localStorage.getItem('meridian-segment');
        } catch (e) {
          console.error(e);
        }
        if(theme !=='light' && theme !=='dark'){
          var prefersDark=matchMedia('prefers-color-scheme:dark').matches
          theme = prefersDark ? 'dark' : 'light';
        }
        root.dataset.theme = theme; //<html data-theme='dark'
        if(segment === 'retail' || segment === 'premium'){
          root.dataset.segment = segment; //<html data-segment='premium'
        }

      })()

    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
